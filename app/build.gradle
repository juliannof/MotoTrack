plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'com.google.devtools.ksp' version '1.9.10-1.0.13'
    id 'androidx.navigation.safeargs.kotlin'
    // Inyecta MAPS_API_KEY (de local.properties) en el manifest
    id 'com.google.android.libraries.mapsplatform.secrets-gradle-plugin'
}

// ── Versión = commit ───────────────────────────────────────────────────────────
// Cada APK lleva el commit con el que se compiló (versionName "1.0+abc1234", y "-dirty" si había
// cambios sin guardar). Antes de instalar se lee el del móvil y se compara (ver abajo), para no
// pisar sin querer una versión más nueva con una rama antigua.
def git = { String... args ->
    try {
        def p = (['git'] + args.toList()).execute(null, rootDir)
        def out = new StringBuilder(); def err = new StringBuilder()
        p.consumeProcessOutput(out, err)
        p.waitFor()
        [p.exitValue(), out.toString().trim()]
    } catch (Exception e) {
        [-1, '']
    }
}
def gitHash = git('rev-parse', '--short=7', 'HEAD')[1] ?: 'sin-git'
def gitDirty = git('status', '--porcelain', '--untracked-files=no')[1] ? '-dirty' : ''

android {
    compileSdk 34
    namespace 'com.mototrack'

    defaultConfig {
        applicationId "com.mototrack"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0+${gitHash}${gitDirty}"
    }

    buildFeatures {
        viewBinding true
        // El secrets-plugin genera campos en BuildConfig; en AGP 8 hay que activarlo
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

secrets {
    propertiesFileName = "local.properties"
    // Valor por defecto para que el build no falle si no hay key (el mapa saldrá gris)
    defaultPropertiesFileName = "local.defaults.properties"
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.22"
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Room DB
    implementation "androidx.room:room-runtime:2.6.1"
    implementation "androidx.room:room-ktx:2.6.1"
    ksp "androidx.room:room-compiler:2.6.1"

    // ViewModel + LiveData
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:2.7.0"
    implementation "androidx.lifecycle:lifecycle-service:2.7.0"

    // Navigation
    implementation "androidx.navigation:navigation-fragment-ktx:2.7.6"
    implementation "androidx.navigation:navigation-ui-ktx:2.7.6"

    // Coroutines
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"

    // Google Maps
    implementation 'com.google.android.gms:play-services-maps:18.2.0'
    implementation 'com.google.android.gms:play-services-location:21.1.0'
    implementation 'com.google.maps.android:android-maps-utils:3.8.2'   // mapa de calor (HeatmapTileProvider)

    // Acceso con Google (Credential Manager; no requiere Firebase)
    implementation 'androidx.credentials:credentials:1.2.2'
    implementation 'androidx.credentials:credentials-play-services-auth:1.2.2'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.0'

    // Carga de la foto de perfil
    implementation 'io.coil-kt:coil:2.5.0'

    // Charts
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'

    // Gson
    implementation 'com.diogobernardino:williamchart:3.10.1'
}

// ── Guarda contra instalar una versión antigua ────────────────────────────────
// Falla si (1) el commit que hay instalado en el móvil no está en la historia de este build
// (ese build no tiene todo lo que tiene el del móvil) o (2) esta rama no incluye origin/main.
// Para saltársela a propósito: ./gradlew installDebug -PforzarInstalacion
tasks.register('verificarVersionInstalada') {
    doLast {
        if (project.hasProperty('forzarInstalacion')) {
            println 'verificarVersionInstalada: saltada con -PforzarInstalacion'
            return
        }
        // (2) La rama debe contener todo lo de origin/main
        def main = git('rev-parse', '--verify', '-q', 'origin/main')
        if (main[0] == 0 && git('merge-base', '--is-ancestor', 'origin/main', 'HEAD')[0] != 0) {
            throw new GradleException(
                "Esta rama (${gitHash}) no incluye todo origin/main: instalarla sería poner una " +
                "versión antigua. Trabaja sobre main actualizado (git pull). " +
                "Para instalarla igualmente: -PforzarInstalacion")
        }
        // (1) Lo que hay instalado en el móvil
        def adb = android.adbExecutable.absolutePath
        def proc = [adb, 'shell', 'dumpsys', 'package', 'com.mototrack'].execute()
        def out = new StringBuilder(); def err = new StringBuilder()
        proc.consumeProcessOutput(out, err)
        proc.waitFor()
        def m = (out.toString() =~ /versionName=1\.0\+([0-9a-f]{7})(-dirty)?/)
        if (!m.find()) {
            println 'verificarVersionInstalada: no se pudo leer el commit instalado (móvil sin la app, ' +
                    'sin dispositivo o instalada antes de este control): se instala.'
            return
        }
        def instalado = m.group(1)
        def sucio = m.group(2) != null
        if (git('cat-file', '-e', "${instalado}^{commit}")[0] != 0) {
            println "verificarVersionInstalada: el commit instalado ${instalado} no existe en este repositorio: se instala."
            return
        }
        if (git('merge-base', '--is-ancestor', instalado, 'HEAD')[0] != 0) {
            def autor = git('log', '-1', '--format=%h %ad %s', '--date=short', instalado)[1]
            throw new GradleException(
                "El móvil tiene un build MÁS NUEVO o de otra rama: ${autor}. " +
                "Este build (${gitHash}) no lo contiene, así que lo pisarías con una versión antigua. " +
                "Fusiona esa rama o usa -PforzarInstalacion si es lo que quieres.")
        }
        if (sucio) {
            println "verificarVersionInstalada: AVISO, el móvil tiene un build de ${instalado} con cambios " +
                    'sin guardar; al instalar se pierden esos cambios en el móvil.'
        }
        println "verificarVersionInstalada: ok (móvil ${instalado} -> este ${gitHash}${gitDirty})"
    }
}
tasks.matching { it.name == 'installDebug' }.configureEach { dependsOn 'verificarVersionInstalada' }
